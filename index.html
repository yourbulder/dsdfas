<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Tic-Tac-Toe Pro</title>
    
    <!-- PeerJS for Private Game Rooms -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    
    <!-- Firebase for Global Chat Sync -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        /* --- LEFT PANEL (CHAT) --- */
        .chat-panel {
            width: 320px;
            height: 600px;
            background-color: #aae0aa;
            border: 6px solid black;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            background-color: #2b8a3e;
            border-bottom: 6px solid black;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-text {
            background-color: white;
            border: 4px solid black;
            border-radius: 15px;
            padding: 2px 10px;
            font-weight: bold;
        }
        
        .chat-mode-badge {
            font-size: 12px;
            color: white;
            font-weight: bold;
            background-color: #1e692c;
            padding: 4px 8px;
            border-radius: 10px;
            border: 2px solid black;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg-container {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        /* RIGHT ALIGN FOR MY MESSAGES */
        .msg-container.mine {
            align-self: flex-end;
            align-items: flex-end;
            margin-left: auto; 
        }

        /* LEFT ALIGN FOR FRIEND MESSAGES */
        .msg-container.theirs {
            align-self: flex-start;
            align-items: flex-start;
            margin-right: auto;
        }

        .msg-name {
            font-size: 11px;
            font-weight: bold;
            color: #1e692c;
            margin-bottom: 2px;
            padding: 0 5px;
        }

        .msg-bubble {
            background-color: white;
            border: 4px solid black;
            border-radius: 20px;
            padding: 8px 15px;
            word-wrap: break-word;
            font-weight: bold;
        }

        .msg-container.mine .msg-bubble {
            border-bottom-right-radius: 5px;
            background-color: #dcf8c6;
        }

        .msg-container.theirs .msg-bubble {
            border-top-left-radius: 5px;
            background-color: white;
        }

        .chat-input-area {
            padding: 10px;
            background-color: #aae0aa;
            border-top: 6px solid black;
        }

        .chat-input-box {
            display: flex;
            background-color: white;
            border: 4px solid black;
            border-radius: 5px;
            padding: 5px;
            align-items: center;
        }

        .chat-input-box input {
            border: none;
            outline: none;
            flex-grow: 1;
            font-weight: bold;
            width: 100%;
        }

        /* SEND BUTTON STYLING */
        .send-btn {
            background-color: #2b8a3e;
            color: white;
            border: 3px solid black;
            border-radius: 5px;
            padding: 4px 10px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
            font-size: 12px;
        }

        .send-btn:hover {
            background-color: #1e692c;
        }

        /* --- RIGHT PANEL (LOBBY & GAME) --- */
        .right-panel {
            width: 350px;
            height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .lobby-view {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .login-box {
            background-color: #72c472;
            border: 6px solid black;
            border-radius: 40px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-line {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-line input {
            background: transparent;
            border: none;
            border-bottom: 4px solid black;
            outline: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            width: 80%;
        }
        .input-line input::placeholder { color: rgba(255,255,255,0.7); }

        .action-button {
            background-color: #2b8a3e;
            border: 6px solid black;
            border-radius: 30px;
            padding: 15px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        .action-button:hover { background-color: #1e692c; }
        .btn-quit { background-color: #dc2626; margin-top: 5px;}
        .btn-quit:hover { background-color: #991b1b; }

        .game-view {
            display: none;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .game-board-container {
            background-color: #4ade80;
            border: 6px solid black;
            border-radius: 40px;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-header {
            width: 100%;
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .game-header span {
            border-bottom: 2px solid white;
            display: inline-block;
            min-width: 100px;
        }

        .turn-indicator {
            font-weight: bold;
            font-size: 18px;
            margin: 15px 0;
            text-align: center;
        }

        .tic-tac-toe {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            background-color: black;
            gap: 4px;
            border: 4px solid black;
        }

        .cell {
            background-color: #4ade80;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell.x { color: red; }
        .cell.o { color: #0ea5e9; }

        .name-display {
            background-color: #2b8a3e;
            border: 6px solid black;
            border-radius: 20px;
            padding: 10px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-top: 5px;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 750px) {
            body {
                flex-direction: column;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <!-- LEFT PANEL: CHAT -->
    <div class="chat-panel">
        <div class="chat-header">
            <div class="chat-header-text">chat</div>
            <div class="chat-mode-badge" id="chat-mode-badge">GLOBAL</div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages render here -->
        </div>
        <div class="chat-input-area">
            <div class="chat-input-box">
                <span style="margin-right: 5px;">💬</span>
                <input type="text" id="chat-input" placeholder="type msg" onkeypress="handleChatKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL: LOBBY & GAME -->
    <div class="right-panel">
        
        <!-- LOBBY STATE -->
        <div class="lobby-view" id="lobby-view">
            <div class="login-box">
                <div class="input-line">
                    <input type="text" id="room-name" placeholder="room name">
                </div>
                <div class="input-line">
                    <input type="password" id="room-pass" placeholder="room pass">
                </div>
                <div class="action-button" onclick="createRoom()">CREATE ROOM</div>
                <div class="action-button" onclick="joinRoom()">JOIN ROOM</div>
            </div>
            
            <div>
                <div class="input-line" style="background-color: #2b8a3e; border: 6px solid black; border-radius: 30px; padding: 15px;">
                    <input type="text" id="your-name" placeholder="your name (required)">
                </div>
            </div>
        </div>

        <!-- GAME STATE -->
        <div class="game-view" id="game-view">
            <div class="game-board-container">
                <div class="game-header">
                    ROOM ID :- <span id="display-room-id"></span><br>
                    pass :- <span id="display-room-pass"></span>
                </div>
                
                <div class="turn-indicator" id="turn-indicator">WAITING FOR OPPONENT...</div>
                
                <div class="tic-tac-toe" id="board">
                    <div class="cell" onclick="makeMove(0)"></div>
                    <div class="cell" onclick="makeMove(1)"></div>
                    <div class="cell" onclick="makeMove(2)"></div>
                    <div class="cell" onclick="makeMove(3)"></div>
                    <div class="cell" onclick="makeMove(4)"></div>
                    <div class="cell" onclick="makeMove(5)"></div>
                    <div class="cell" onclick="makeMove(6)"></div>
                    <div class="cell" onclick="makeMove(7)"></div>
                    <div class="cell" onclick="makeMove(8)"></div>
                </div>
            </div>
            
            <div class="action-button" onclick="requestNewGame()">NEW GAME</div>
            <div class="action-button btn-quit" onclick="quitRoom()">QUIT ROOM</div>
            <div class="name-display" id="display-name">your name</div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ FIREBASE SETUP WITH YOUR KEYS ⚠️
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDaFggwGKQJswcouN6l4LCTV6uapi4ivaQ",
            authDomain: "whatshapp-94037.firebaseapp.com",
            databaseURL: "https://whatshapp-94037-default-rtdb.firebaseio.com", 
            projectId: "whatshapp-94037",
            storageBucket: "whatshapp-94037.firebasestorage.app",
            messagingSenderId: "882905744267",
            appId: "1:882905744267:web:6118488a9d8170120ce58e",
            measurementId: "G-KM4RT7161E"
        };

        // Initialize Firebase Database
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // App Variables
        let peer = null;
        let connection = null;
        let myName = "Player";
        let friendName = "Friend";
        let isHost = false;
        let inRoom = false;
        
        // Game State
        let board = ["", "", "", "", "", "", "", "", ""];
        let mySymbol = "X";
        let currentTurn = "X";
        let gameActive = true;

        // Chat Storage
        let globalChat = [];
        let roomChat = [];

        // UI Elements
        const lobbyView = document.getElementById('lobby-view');
        const gameView = document.getElementById('game-view');
        const chatMessages = document.getElementById('chat-messages');
        const cells = document.querySelectorAll('.cell');
        const turnIndicator = document.getElementById('turn-indicator');
        const chatModeBadge = document.getElementById('chat-mode-badge');
        const nameInput = document.getElementById('your-name');

        window.onload = () => {
            // Restore name from local device storage so they don't have to re-type it
            const savedName = localStorage.getItem('karanUsername');
            if (savedName) {
                nameInput.value = savedName;
                myName = savedName;
            }
            renderChat(); // Renders the initial chat header
        };

        // 🟢 LISTEN TO FIREBASE REALTIME DATABASE 🟢
        db.ref("global_chat").on("child_added", (snapshot) => {
            const data = snapshot.val();
            const currentName = nameInput.value.trim();
            
            // Check if this message was sent by the current user (for green styling)
            const isMine = (data.sender === currentName && currentName !== "");
            
            // Store it in the local globalChat array
            globalChat.push({ sender: data.sender, msg: data.msg, isMine: isMine });
            
            // Render immediately if we are currently looking at the Global Chat
            if (!inRoom) {
                addMessageToUI(data.sender, data.msg, isMine);
            }
        });

        function getSanitizedRoomId() {
            const rn = document.getElementById('room-name').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            const rp = document.getElementById('room-pass').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            return `karangame-${rn}-${rp}`;
        }

        function validateSetup() {
            myName = nameInput.value.trim();
            if (!myName) {
                alert("Please enter 'your name' at the bottom first!");
                return false;
            }
            localStorage.setItem('karanUsername', myName); // Save for next time
            if (!document.getElementById('room-name').value.trim() || !document.getElementById('room-pass').value.trim()) {
                alert("Enter room name and password!");
                return false;
            }
            return true;
        }

        function cleanPeer() {
            if (connection) {
                connection.close();
                connection = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
        }

        function createRoom() {
            if(!validateSetup()) return;
            cleanPeer();
            
            isHost = true;
            mySymbol = "X";
            const roomId = getSanitizedRoomId();
            
            peer = new Peer(roomId); 
            peer.on('open', () => {
                switchToGameView();
                appendSystemMessage("Room created. Waiting for someone to join...");
                turnIndicator.innerText = "WAITING FOR OPPONENT...";
            });

            peer.on('connection', (conn) => {
                connection = conn;
                setupConnectionListeners();
            });

            peer.on('error', (err) => { 
                if (err.type === 'unavailable-id') {
                    alert("This Room Name & Password combo is currently active. Try joining instead!");
                } else {
                    alert("Room Error: " + err.type); 
                }
                quitRoom(false);
            });
        }

        function joinRoom() {
            if(!validateSetup()) return;
            cleanPeer();

            isHost = false;
            mySymbol = "O";
            const roomId = getSanitizedRoomId();
            
            peer = new Peer(); 
            peer.on('open', () => {
                connection = peer.connect(roomId);
                
                connection.on('open', () => {
                    setupConnectionListeners();
                    connection.send({ type: 'handshake', name: myName });
                });
            });

            peer.on('error', () => { 
                alert("Could not connect! Room not found or wrong details."); 
                quitRoom(false);
            });
        }

        function setupConnectionListeners() {
            connection.on('data', (data) => {
                if (data.type === 'handshake') {
                    friendName = data.name;
                    if (friendName === myName) {
                        myName = myName + "_" + Math.floor(Math.random() * 1000);
                    }
                    connection.send({ type: 'handshake-reply', approvedName: myName, hostName: myName });
                    finalizeRoomJoin();
                } 
                else if (data.type === 'handshake-reply') {
                    myName = data.approvedName;
                    friendName = data.hostName;
                    document.getElementById('display-name').innerText = myName;
                    nameInput.value = myName;
                    finalizeRoomJoin();
                }
                else if (data.type === 'chat') {
                    addMessageToUI(data.sender, data.msg, false); // Friend msg
                } 
                else if (data.type === 'move') {
                    receiveMove(data.index, data.symbol);
                } 
                else if (data.type === 'new-game') {
                    resetBoard();
                    appendSystemMessage(`${friendName} started a new game!`);
                }
            });

            connection.on('close', () => {
                alert("The other player disconnected.");
                quitRoom(false);
            });
        }

        function finalizeRoomJoin() {
            switchToGameView();
            appendSystemMessage(`${friendName} joined the room!`);
            resetBoard();
        }

        function switchToGameView() {
            inRoom = true;
            lobbyView.style.display = 'none';
            gameView.style.display = 'flex';
            document.getElementById('display-name').innerText = myName;
            document.getElementById('display-room-id').innerText = document.getElementById('room-name').value;
            document.getElementById('display-room-pass').innerText = document.getElementById('room-pass').value;
            
            chatModeBadge.innerText = "PRIVATE ROOM";
            chatModeBadge.style.backgroundColor = "#dc2626";
            roomChat = [];
            renderChat();
        }

        function quitRoom(triggerClose = true) {
            inRoom = false;
            
            if (triggerClose && connection) {
                connection.close();
            }
            cleanPeer();

            lobbyView.style.display = 'flex';
            gameView.style.display = 'none';
            chatModeBadge.innerText = "GLOBAL";
            chatModeBadge.style.backgroundColor = "#1e692c";
            
            resetBoard();
            renderChat(); // Re-render Firebase global chat history
        }

        // --- CHAT LOGIC ---

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            let tempName = nameInput.value.trim();
            
            if (!tempName) {
                alert("Bro, you must enter 'your name' at the bottom right before sending a message!");
                return; 
            }

            localStorage.setItem('karanUsername', tempName); // Update local save
            if (inRoom) tempName = myName;

            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            
            if (msg) {
                if (inRoom && connection && connection.open) {
                    // Send Private PeerJS Message
                    connection.send({ type: 'chat', msg: msg, sender: tempName });
                    addMessageToUI(tempName, msg, true);
                } else if (inRoom) {
                    addMessageToUI(tempName, msg, true);
                    appendSystemMessage("Waiting for opponent to connect to see this message...");
                } else {
                    // 🚀 PUSH TO FIREBASE INSTEAD OF LOCALSTORAGE
                    db.ref("global_chat").push({
                        sender: tempName,
                        msg: msg,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    // Note: We don't call addMessageToUI() here because the 'child_added' listener does it for us instantly!
                }
                input.value = '';
            }
        }

        function addMessageToUI(sender, msg, isMine) {
            if (inRoom) {
                roomChat.push({ sender, msg, isMine });
            }
            
            const container = document.createElement('div');
            container.className = `msg-container ${isMine ? 'mine' : 'theirs'}`;
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'msg-name';
            nameDiv.innerText = sender;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'msg-bubble';
            bubbleDiv.innerText = msg;
            
            container.appendChild(nameDiv);
            container.appendChild(bubbleDiv);
            
            chatMessages.appendChild(container);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendSystemMessage(msg) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '12px';
            div.style.color = 'gray';
            div.style.margin = '5px 0';
            div.style.fontWeight = 'bold';
            div.innerText = msg;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function renderChat() {
            chatMessages.innerHTML = "";
            const activeChat = inRoom ? roomChat : globalChat;
            
            if (!inRoom) {
                appendSystemMessage("--- GLOBAL LIVE CHAT ---");
            } else {
                appendSystemMessage("--- PRIVATE ROOM CHAT ---");
            }

            activeChat.forEach(c => {
                addMessageToUI(c.sender, c.msg, c.isMine);
            });
        }

        // --- TIC TAC TOE LOGIC ---
        
        function makeMove(index) {
            if (!inRoom || !connection || !connection.open) {
                alert("Wait for an opponent to join before playing!");
                return;
            }
            if (!gameActive || board[index] !== "" || currentTurn !== mySymbol) return;
            
            updateBoard(index, mySymbol);
            connection.send({ type: 'move', index: index, symbol: mySymbol });
            checkWinner();
        }

        function receiveMove(index, symbol) {
            updateBoard(index, symbol);
            checkWinner();
        }

        function updateBoard(index, symbol) {
            board[index] = symbol;
            const cellElement = cells[index];
            cellElement.innerText = symbol;
            cellElement.classList.add(symbol.toLowerCase());
            currentTurn = currentTurn === "X" ? "O" : "X";
            updateTurnIndicator();
        }

        function updateTurnIndicator() {
            if (!connection || !connection.open) {
                turnIndicator.innerText = "WAITING FOR OPPONENT...";
                return;
            }
            if (currentTurn === mySymbol) {
                turnIndicator.innerText = `YOUR TURN :- ${mySymbol}`;
            } else {
                turnIndicator.innerText = `${friendName}'S TURN :- ${currentTurn}`;
            }
        }

        function checkWinner() {
            const winConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]            
            ];

            let roundWon = false;
            for (let i = 0; i < winConditions.length; i++) {
                const [a, b, c] = winConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                const winner = currentTurn === "X" ? "O" : "X";
                turnIndicator.innerText = winner === mySymbol ? "YOU WON! 🎉" : "YOU LOST! 😢";
                gameActive = false;
                return;
            }

            if (!board.includes("")) {
                turnIndicator.innerText = "IT'S A DRAW!";
                gameActive = false;
            }
        }

        function requestNewGame() {
            if (connection && connection.open) {
                connection.send({ type: 'new-game' });
                resetBoard();
            } else {
                resetBoard();
            }
        }

        function resetBoard() {
            board = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            currentTurn = "X";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.className = "cell";
            });
            if (inRoom) updateTurnIndicator();
        }
    </script>
</body>
</html>
